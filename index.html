<!-- Script Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.pathname === '/host') {
                const splash = document.getElementById('screen-splash');
                if (splash) splash.classList.add('hidden');
                
                document.getElementById('screen-join').classList.add('hidden');
                document.getElementById('screen-dashboard').classList.remove('hidden');
                
                switchView('host');
            }
        });

        const socket = io({
            transports: ['websocket'],
            upgrade: false
        });
        
        let currentSid = null;
        let myName = localStorage.getItem('bun_fight_nickname') || '';
        let lastProcessedHistoryLength = 0; 
        let wasInGame = false; 
        let pendingJoinName = null;
        let lastKnownRoundNum = 0;

        const emojiMap = { 
            'BUN': '🥯 BUN', 
            'TORTILLA': '🫓 TORTILLA', 
            'CROISSANT': '🥐 CROISSANT' 
        };

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.addEventListener('click', () => {
            getAudioContext();
        }, { once: true });

        function dismissSplash() {
            getAudioContext();
            document.getElementById('screen-splash').classList.add('hidden');
            
            if (myName) {
                document.getElementById('screen-dashboard').classList.remove('hidden');
                document.getElementById('display-my-name').innerText = `👤 ${myName}`;
                wasInGame = true;
                socket.emit('join_game', { name: myName });
            } else {
                document.getElementById('screen-join').classList.remove('hidden');
            }
        }

        function playTicTocSound() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, ctx.currentTime); 
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        }

        function playLockInSound() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); 
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        function playVictoryMelody() {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (i * 0.15));
                gain.gain.setValueAtTime(0.25, now + (i * 0.15));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.15) + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + (i * 0.15));
                osc.stop(now + (i * 0.15) + 0.35);
            });
        }

        function playDefeatMelody() {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const notes = [330, 311, 293, 277];
            
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + (i * 0.18));
                gain.gain.setValueAtTime(0.15, now + (i * 0.18));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.18) + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + (i * 0.18));
                osc.stop(now + (i * 0.18) + 0.3);
            });
        }

        function triggerVictoryReward(isMatchEnd, roundNum, winnerName) {
            if (!document.getElementById('view-host').classList.contains('hidden')) return;

            playVictoryMelody();
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);

            const modal = document.getElementById('reward-modal');
            const title = document.getElementById('reward-title');
            const desc = document.getElementById('reward-desc');
            const bonus = document.getElementById('reward-bonus');
            const icon = document.getElementById('reward-icon');

            if (isMatchEnd) {
                icon.innerText = "👑🏆";
                title.innerText = "CHAMPION CROWNED!";
                desc.innerText = `Incredible victory, ${winnerName}! You claimed ultimate supremacy!`;
                bonus.innerText = `+150 ESP & Streak Bonus`;
            } else {
                icon.innerText = "✨🥐";
                title.innerText = `Round ${roundNum} Victory!`;
                desc.innerText = "Fantastic prediction! You secured this round.";
                bonus.innerText = `+50 ESP`;
            }
            modal.classList.remove('hidden');
        }

        function triggerDefeatReward(isMatchEnd, roundNum, winnerName) {
            if (!document.getElementById('view-host').classList.contains('hidden')) return;

            playDefeatMelody();
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            const modal = document.getElementById('reward-modal');
            const title = document.getElementById('reward-title');
            const desc = document.getElementById('reward-desc');
            const bonus = document.getElementById('reward-bonus');
            const icon = document.getElementById('reward-icon');

            if (isMatchEnd) {
                icon.innerText = "💥💀";
                title.innerText = "YOU LOSE!";
                desc.innerText = `${winnerName} took the crown. Try again, better luck next time!`;
                bonus.innerText = `ESP Rating Adjusted`;
            } else {
                icon.innerText = "❌";
                title.innerText = `Round ${roundNum} Lost`;
                desc.innerText = "Try again! Better luck next time.";
                bonus.innerText = `Keep your head up!`;
            }
            modal.classList.remove('hidden');
        }

        function closeRewardModal() {
            document.getElementById('reward-modal').classList.add('hidden');
        }

        let ticTocInterval = null;
        function startTicToc() {
            stopTicToc();
            ticTocInterval = setInterval(() => playTicTocSound(), 1000);
        }
        function stopTicToc() {
            if (ticTocInterval) {
                clearInterval(ticTocInterval);
                ticTocInterval = null;
            }
        }

        function switchView(view) {
            if (view === 'player') {
                document.getElementById('view-player').classList.remove('hidden');
                document.getElementById('view-host').classList.add('hidden');
                document.getElementById('btn-player-view').className = 'bg-amber-700 px-3 py-1 rounded text-sm font-semibold cursor-pointer';
                document.getElementById('btn-host-view').className = 'bg-amber-800 px-3 py-1 rounded text-sm font-semibold opacity-75 cursor-pointer';
            } else {
                document.getElementById('view-player').classList.add('hidden');
                document.getElementById('view-host').classList.remove('hidden');
                document.getElementById('btn-host-view').className = 'bg-amber-700 px-3 py-1 rounded text-sm font-semibold cursor-pointer';
                document.getElementById('btn-player-view').className = 'bg-amber-800 px-3 py-1 rounded text-sm font-semibold opacity-75 cursor-pointer';
            }
        }

        function showJoinError(message) {
            const errEl = document.getElementById('join-error');
            errEl.innerText = message;
            errEl.classList.remove('hidden');
        }

        function clearJoinError() {
            const errEl = document.getElementById('join-error');
            errEl.classList.add('hidden');
            errEl.innerText = '';
        }

        function joinGame(e) {
            if (e) e.preventDefault();
            clearJoinError();
            const inputVal = document.getElementById('nickname').value.trim().toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6);
            const attemptedName = inputVal || myName;
            if (!attemptedName) return;

            pendingJoinName = attemptedName;
            socket.emit('join_game', { name: attemptedName });
        }

        function confirmJoin(name) {
            myName = name;
            pendingJoinName = null;
            wasInGame = true;
            localStorage.setItem('bun_fight_nickname', myName);
            document.getElementById('display-my-name').innerText = `👤 ${myName}`;
            document.getElementById('screen-join').classList.add('hidden');
            document.getElementById('screen-dashboard').classList.remove('hidden');
        }

        function makeChoice(choice) {
            stopTicToc();
            playLockInSound();
            socket.emit('make_choice', { choice: choice });
            
            const badge = document.getElementById('choice-status-badge');
            badge.className = 'bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold';
            badge.innerText = `Choice Locked: ${choice}! 🎯`;
            
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('opacity-50', 'pointer-events-none'));
        }

        function resetPlayerButtons() {
            document.querySelectorAll('.choice-btn').forEach(b => {
                b.classList.remove('opacity-50', 'pointer-events-none');
            });
            const badge = document.getElementById('choice-status-badge');
            if (badge) {
                badge.className = 'bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm';
                badge.innerText = 'Make your move!';
            }
        }

        function resetGame() {
            if (confirm("Are you sure you want to reset the game state?")) {
                socket.emit('reset_game');
            }
        }

        socket.on('connect', () => {
            currentSid = socket.id;
            if (wasInGame && myName) {
                pendingJoinName = myName;
                socket.emit('join_game', { name: myName });
            }
        });

        socket.on('join_error', (data) => {
            pendingJoinName = null;
            showJoinError((data && data.message) || 'Could not join. Try a different nickname.');
        });

        socket.on('state_update', (state) => {
            if (pendingJoinName) {
                const nameIsLive =
                    (state.champion && state.champion.name === pendingJoinName) ||
                    state.queue.some(q => q.name === pendingJoinName) ||
                    (state.match && (state.match.challenger_name === pendingJoinName || state.match.champ_name === pendingJoinName));
                if (nameIsLive) {
                    confirmJoin(pendingJoinName);
                }
            }

            if (state.champion) {
                document.getElementById('host-champ-name').innerText = state.champion.name;
                document.getElementById('host-champ-streak').innerText = `🔥 ${state.champion.streak}`;
            } else {
                document.getElementById('host-champ-name').innerText = 'No Champion Yet';
                document.getElementById('host-champ-streak').innerText = '🔥 0';
            }

            const queueList = document.getElementById('queue-list');
            document.getElementById('queue-count').innerText = `${state.queue.length} waiting`;
            if (state.queue.length === 0) {
                queueList.innerHTML = `<li class="text-slate-400 text-sm text-center py-2">Queue is empty</li>`;
            } else {
                queueList.innerHTML = state.queue.map((q, idx) => `
                    <li class="bg-amber-50 px-3 py-2 rounded-lg text-sm font-semibold flex justify-between items-center border border-amber-100">
                        <span>#${idx + 1} ${escapeHtml(q.name)}</span>
                        ${q.name === myName ? '<span class="text-xs bg-amber-500 text-white px-2 py-0.5 rounded">You</span>' : ''}
                    </li>
                `).join('');
            }

            const lbList = document.getElementById('leaderboard-list');
            if (state.leaderboard.length === 0) {
                lbList.innerHTML = `<li class="text-slate-400 text-sm text-center py-2">No psychic energy detected</li>`;
            } else {
                lbList.innerHTML = state.leaderboard.map((p, idx) => `
                    <li class="flex justify-between items-center text-sm py-1.5 border-b border-slate-100 last:border-0">
                        <span class="font-semibold text-slate-700">${idx === 0 ? '👑 ' : ''}${idx + 1}. ${escapeHtml(p.name)}</span>
                        <div class="text-right"><span class="font-bold text-indigo-600">${p.esp_rating} ESP</span></div>
                    </li>
                `).join('');
            }

            const hostInactive = document.getElementById('host-match-inactive');
            const hostActive = document.getElementById('host-match-active');
            const battleControls = document.getElementById('battle-controls');
            const playerStatusTitle = document.getElementById('player-status-title');
            const playerStatusDesc = document.getElementById('player-status-desc');
            const startMatchContainer = document.getElementById('start-match-container');

            const me = state.leaderboard.find(p => p.name === myName);
            if (me) {
                document.getElementById('my-streak').innerText = me.streak;
                document.getElementById('my-esp').innerText = me.esp_rating;
            }

            if (state.game_mode === "WAITING") {
                stopTicToc();
                hostInactive.classList.remove('hidden');
                hostActive.classList.add('hidden');
                battleControls.classList.add('hidden');
                lastProcessedHistoryLength = 0;
                lastKnownRoundNum = 0;
                
                const qIdx = state.queue.findIndex(q => q.name === myName);
                const isChamp = state.champion && state.champion.name === myName;

                if (state.champion && state.queue.length > 0) {
                    startMatchContainer.classList.remove('hidden');
                } else {
                    startMatchContainer.classList.add('hidden');
                }

                if (isChamp) {
                    playerStatusTitle.innerText = "👑 You are the Champion!";
                    playerStatusDesc.innerText = "Wait for the next challenger to enter the arena.";
                } else if (qIdx !== -1) {
                    playerStatusTitle.innerText = `⏳ Position #${qIdx + 1} in Queue`;
                    playerStatusDesc.innerText = "Get ready! Stretch your psychic powers.";
                } else {
                    playerStatusTitle.innerText = "Ready to Fight!";
                    playerStatusDesc.innerText = "Join the queue above to start battling.";
                }
            } else {
                startMatchContainer.classList.add('hidden');

                if (state.game_mode === "MATCH_IN_PROGRESS" || state.game_mode === "ROUND_OVER") {
                    hostInactive.classList.add('hidden');
                    hostActive.classList.remove('hidden');

                    const isMatchPlayer = state.match && (namesMatch(state.match.challenger_name, myName) || namesMatch(state.match.champ_name, myName));
                    if (isMatchPlayer && state.game_mode === "MATCH_IN_PROGRESS") {
                        battleControls.classList.remove('hidden');
                        
                        // Check if round advanced to re-enable choice buttons
                        if (state.match.round_num !== lastKnownRoundNum) {
                            resetPlayerButtons();
                            lastKnownRoundNum = state.match.round_num;
                        }
                    } else {
                        battleControls.classList.add('hidden');
                    }

                    document.getElementById('hm-challenger-name').innerText = state.match.challenger_name;
                    document.getElementById('hm-champ-name').innerText = state.match.champ_name;
                    document.getElementById('hm-p1-wins').innerText = state.match.p1_wins;
                    document.getElementById('hm-p2-wins').innerText = state.match.p2_wins;

                    const p1Locked = state.match.p1_choice_made;
                    const p2Locked = state.match.p2_choice_made;

                    document.getElementById('hm-p1-status').innerText = p1Locked ? "⚡ Choice Logged" : "🤔 Choosing...";
                    document.getElementById('hm-p2-status').innerText = p2Locked ? "⚡ Choice Logged" : "🤔 Choosing...";

                    const history = state.match.history;
                    let historyList = document.getElementById('host-history-list');
                    if (!history || history.length === 0) {
                        historyList.innerHTML = `<span class="text-slate-400 italic">No matches played yet in this round series.</span>`;
                    } else {
                        historyList.innerHTML = history.map(h => `
                            <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded border border-slate-200">
                                <span class="font-bold text-slate-700">Round ${h.round_num}</span>
                                <span class="text-slate-600">${escapeHtml(h.winner)} won (${escapeHtml(h.p1_choice)} vs ${escapeHtml(h.p2_choice)})</span>
                            </div>
                        `).join('');
                    }

                    if (state.game_mode === "ROUND_OVER" && history.length > lastProcessedHistoryLength) {
                        lastProcessedHistoryLength = history.length;
                        const latestRound = history[history.length - 1];
                        const isMatchEnd = state.match.p1_wins >= 2 || state.match.p2_wins >= 2;
                        
                        if (latestRound.winner === myName) {
                            triggerVictoryReward(isMatchEnd, latestRound.round_num, latestRound.winner);
                        } else if (latestRound.winner && latestRound.winner !== "Tie") {
                            triggerDefeatReward(isMatchEnd, latestRound.round_num, latestRound.winner);
                        }
                    }
                }
            }
        });
    </script>

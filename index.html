<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bun Fight Arena - Match vs Game Win Mod</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header / Scoreboard Tracker -->
    <header class="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl flex justify-between items-center">
        <!-- Player 1 Status -->
        <div class="flex flex-col items-start">
            <span id="p1-name" class="font-bold text-lg text-amber-400">Player 1</span>
            <div class="flex gap-2 text-xs text-slate-400 mt-1">
                <span>Match Wins (Sets): <strong id="p1-match-wins" class="text-white text-sm">0</strong></span>
                <span>| Game Wins (Rounds): <strong id="p1-game-wins" class="text-white text-sm">0/2</strong></span>
            </div>
        </div>

        <!-- Series Info -->
        <div class="text-center">
            <span class="bg-indigo-600 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-bold">Best of 3 Series</span>
            <div id="round-status" class="text-sm text-slate-300 mt-1">Game 1 in Progress</div>
        </div>

        <!-- Player 2 Status -->
        <div class="flex flex-col items-end">
            <span id="p2-name" class="font-bold text-lg text-rose-400">Player 2</span>
            <div class="flex gap-2 text-xs text-slate-400 mt-1">
                <span>Game Wins: <strong id="p2-game-wins" class="text-white text-sm">0/2</strong></span>
                <span>| Match Wins: <strong id="p2-match-wins" class="text-white text-sm">0</strong></span>
            </div>
        </div>
    </header>

    <!-- Main Arena View -->
    <main class="w-full max-w-4xl flex flex-col items-center justify-center my-auto py-8">
        <div id="arena-card" class="bg-slate-800/80 border border-slate-700 rounded-3xl p-8 shadow-2xl text-center w-full max-w-lg">
            <h2 id="announcement" class="text-2xl font-bold mb-6 text-indigo-300">Choose Your Bun Attack!</h2>
            
            <!-- Choice Buttons -->
            <div id="action-buttons" class="grid grid-cols-3 gap-4 mb-8">
                <button onclick="makeChoice('cinnamon')" class="bg-amber-700 hover:bg-amber-600 p-6 rounded-2xl font-bold text-lg transition transform hover:-translate-y-1 shadow-lg flex flex-col items-center gap-2">
                    🥐 <span>Cinnamon</span>
                </button>
                <button onclick="makeChoice('glazed')" class="bg-amber-500 hover:bg-amber-400 text-slate-900 p-6 rounded-2xl font-bold text-lg transition transform hover:-translate-y-1 shadow-lg flex flex-col items-center gap-2">
                    🍩 <span>Glazed</span>
                </button>
                <button onclick="makeChoice('toasted')" class="bg-orange-800 hover:bg-orange-700 p-6 rounded-2xl font-bold text-lg transition transform hover:-translate-y-1 shadow-lg flex flex-col items-center gap-2">
                    🍞 <span>Toasted</span>
                </button>
            </div>

            <!-- Result Log Box -->
            <div id="log-box" class="bg-slate-900/60 border border-slate-800 p-4 rounded-xl text-slate-300 text-sm min-h-[80px] flex items-center justify-center">
                Make your move to start Game 1 of the series!
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-500">
        Bun Fight Arena &bull; Match vs Game Mod Architecture
    </footer>

    <!-- Script Logic for Match vs Game Differentiation -->
    <script>
        // Match State Management
        const matchState = {
            targetGameWins: 2, // 2 Game wins = 1 Match win (Best of 3)
            currentGame: 1,
            players: {
                player1: { name: "Player 1", gameWins: 0, matchWins: 0 },
                player2: { name: "Player 2", gameWins: 0, matchWins: 0 }
            }
        };

        const choices = ['cinnamon', 'glazed', 'toasted'];

        function makeChoice(p1Choice) {
            // Simulate opponent choice for demonstration
            const p2Choice = choices[Math.floor(Math.random() * choices.length)];
            
            let roundWinner = null;
            let logMessage = `You chose <strong>${p1Choice}</strong>. Opponent chose <strong>${p2Choice}</strong>. `;

            if (p1Choice === p2Choice) {
                logMessage += "It's a tie round! Replaying round.";
                updateLog(logMessage);
                return;
            }

            // Simple win matrix logic
            if (
                (p1Choice === 'cinnamon' && p2Choice === 'toasted') ||
                (p1Choice === 'glazed' && p2Choice === 'cinnamon') ||
                (p1Choice === 'toasted' && p2Choice === 'glazed')
            ) {
                roundWinner = 'player1';
                logMessage += "<strong>You won this Game round! 🎉</strong>";
            } else {
                roundWinner = 'player2';
                logMessage += "<strong>Opponent won this Game round! ❌</strong>";
            }

            updateLog(logMessage);
            handleGameWin(roundWinner);
        }

        function handleGameWin(winnerKey) {
            // 1. Increment individual Game Win (Round)
            matchState.players[winnerKey].gameWins += 1;
            updateScoreboard();

            // 2. Check if player has hit the target to win the overall Match (Set)
            if (matchState.players[winnerKey].gameWins >= matchState.targetGameWins) {
                handleMatchWin(winnerKey);
            } else {
                // Advance to the next game in the series
                matchState.currentGame += 1;
                document.getElementById('round-status').innerText = `Game ${matchState.currentGame} in Progress`;
            }
        }

        function handleMatchWin(winnerKey) {
            const winnerName = matchState.players[winnerKey].name;
            
            // 1. Increment overall Match Win
            matchState.players[winnerKey].matchWins += 1;
            
            // 2. Announce Match Victory and reset game blocks for the next series
            alert(`🏆 ${winnerName} has won the entire Match Set! Series resetting.`);
            
            // Reset game-level tallies for a fresh series, keeping match wins intact
            matchState.players.player1.gameWins = 0;
            matchState.players.player2.gameWins = 0;
            matchState.currentGame = 1;
            
            document.getElementById('round-status').innerText = `New Series Started (Game 1)`;
            updateScoreboard();
        }

        function updateScoreboard() {
            document.getElementById('p1-game-wins').innerText = `${matchState.players.player1.gameWins}/2`;
            document.getElementById('p1-match-wins').innerText = matchState.players.player1.matchWins;

            document.getElementById('p2-game-wins').innerText = `${matchState.players.player2.gameWins}/2`;
            document.getElementById('p2-match-wins').innerText = matchState.players.player2.matchWins;
        }

        function updateLog(htmlText) {
            document.getElementById('log-box').innerHTML = htmlText;
        }
    </script>
</body>
</html>
